<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fafb">
  <meta name="description" content="Три розы, нарисованные символами терминала, и пожелание удачи на экзамене.">
  <title>Удачи на экзамене — ASCII roses</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263247;
      --muted: #8190a2;
      --border: #e1e5ec;
      --pink: #dd537f;
      --green: #367b61;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 24px 12px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: #fafbfc;
      background-image: radial-gradient(#e2e6ec 0.65px, transparent 0.65px);
      background-size: 22px 22px;
    }
    .terminal {
      width: min(960px, 100%);
      overflow: hidden;
      border: 1px solid #dbe0e8;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 24px 72px rgba(56, 73, 100, 0.12), 0 4px 14px rgba(56, 73, 100, 0.04);
    }
    .bar {
      position: relative;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #f4f6f9;
      border-bottom: 1px solid var(--border);
      color: #8490a1;
      font-size: 11px;
    }
    .lights { display: flex; gap: 7px; }
    .light { height: 10px; width: 10px; border-radius: 50%; }
    .light:nth-child(1) { background: #ff6d70; }
    .light:nth-child(2) { background: #f8c451; }
    .light:nth-child(3) { background: #5dcc86; }
    .bar-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .bar-right { letter-spacing: .06em; }
    .screen {
      padding: 29px 34px 33px;
      min-height: 560px;
    }
    .command {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-height: 21px;
      white-space: nowrap;
      font-size: 13px;
    }
    .host { color: #38866a; font-weight: 600; }
    .path { color: #788598; }
    .typed { color: #3c4862; }
    .caret {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: #6f8198;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }
    .status {
      margin: 10px 0 8px;
      min-height: 42px;
      color: #8793a4;
      line-height: 1.8;
      font-size: 11px;
    }
    .status div { min-height: 19px; }
    .ok { color: #3c936c; }
    .art-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 5px;
      color: #98a1b0;
      font-size: 11px;
    }
    .art-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #edf0f4;
    }
    .flowers {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 4px;
      padding: 13px 0 17px;
      min-height: 330px;
      overflow: hidden;
    }
    .flower {
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
      font-family: inherit;
      font-size: clamp(7px, 1.15vw, 11.5px);
      line-height: 1.22;
      letter-spacing: 0;
      white-space: pre;
      font-variant-ligatures: none;
      user-select: none;
      --petal: #c54f75;
      --petal-soft: #efa0b7;
    }
    .flower:nth-child(2) { --petal: #e26f9c; --petal-soft: #f5b6ce; }
    .flower:nth-child(3) { --petal: #cc727d; --petal-soft: #f2b2a9; }
    .flower .petal { color: var(--petal); }
    .flower .soft { color: var(--petal-soft); }
    .flower .stem { color: #398567; }
    .flower .leaf { color: #5f9a74; }
    .flower .char { opacity: 0; }
    .flower .char.visible { opacity: 1; }
    .message {
      border-top: 1px dashed #e3e8ee;
      margin-top: 8px;
      padding-top: 20px;
      min-height: 108px;
    }
    .msg-command {
      font-size: 12px;
      color: #8994a3;
      margin-bottom: 13px;
    }
    .message-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 50px;
    }
    .arrow { color: #bc6d8c; font-size: 22px; }
    #wish {
      color: #cf5e86;
      font-weight: 700;
      font-size: clamp(19px, 3.8vw, 33px);
      letter-spacing: -.045em;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .wish-caret {
      width: 3px;
      height: 28px;
      background: #dc81a3;
      animation: blink .8s steps(1) infinite;
    }
    .subtext {
      color: #949cab;
      font-size: 12px;
      min-height: 20px;
      text-align: center;
      margin-top: 5px;
      opacity: 0;
      transition: opacity 500ms ease;
    }
    .subtext.visible { opacity: 1; }
    .foot {
      border-top: 1px solid var(--border);
      padding: 13px 22px;
      background: #fbfcfe;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #929dab;
      font-size: 11px;
    }
    .replay {
      border: 1px solid #e6ced8;
      border-radius: 8px;
      color: #b7537b;
      background: #fff7fa;
      padding: 9px 14px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }
    .replay:hover { background: #fce9f0; transform: translateY(-1px); }
    .replay:focus-visible { outline: 2px solid #cd6692; outline-offset: 3px; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 650px) {
      body { padding: 12px 7px; }
      .screen { padding: 20px 11px 24px; min-height: auto; }
      .flowers { min-height: 225px; gap: 1px; padding: 12px 0; }
      .flower { font-size: clamp(4.6px, 1.28vw, 8px); line-height: 1.28; letter-spacing: -.07px; }
      .command { font-size: 11px; gap: 5px; }
      .bar-right { display: none; }
      .foot { padding: 11px 13px; font-size: 9px; }
      .message { padding-top: 16px; }
      .msg-command { font-size: 10px; }
    }
    @media (max-width: 360px) {
      .bar { padding: 0 11px; }
      .flower { font-size: 4.4px; }
      .host { display: none; }
      .bar-title { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .caret, .wish-caret { animation: none; }
      .subtext { transition: none; }
    }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Розы из символов терминала и пожелание удачи на экзамене">
    <div class="bar">
      <div class="lights" aria-hidden="true"><i class="light"></i><i class="light"></i><i class="light"></i></div>
      <div class="bar-title">roses.py — terminal</div>
      <div class="bar-right">UTF-8 · ASCII ART</div>
    </div>
    <div class="screen">
      <div class="command">
        <span class="host">dream@macbook</span><span class="path">~ %</span>
        <span id="command" class="typed"></span><span class="caret" id="command-caret" aria-hidden="true"></span>
      </div>
      <div class="status" aria-hidden="true"><div id="log1"></div><div id="log2"></div></div>
      <div class="art-label" aria-hidden="true">OUTPUT / flowers.txt</div>
      <div class="flowers" id="flowers" role="img" aria-label="Три цветные розы, напечатанные из текстовых символов">
        <pre class="flower"></pre><pre class="flower"></pre><pre class="flower"></pre>
      </div>
      <div class="message" aria-live="polite">
        <div class="msg-command" id="msg-command"></div>
        <div class="message-line">
          <span class="arrow" aria-hidden="true">&gt;</span>
          <span id="wish"></span><span class="wish-caret" id="wish-caret" aria-hidden="true" hidden></span>
        </div>
        <div class="subtext" id="subtext">Ты со всем справишься ♡</div>
      </div>
    </div>
    <footer class="foot">
      <span>♡ Только символы терминала · Никаких картинок</span>
      <button class="replay" id="replay" type="button">↻ Повторить анимацию</button>
    </footer>
  </main>
  <script>
    // The roses are made of real monospace characters, not images, SVG or canvas.
    const rose = [
      "           .-~~~~-.           ",
      "        .-'  .--.  '-.        ",
      "      .'  .-(oo)-.   '.      ",
      "     /  .-(@@@@@@)-.  \\     ",
      "    (  (@@@@@@@@@@@@)  )    ",
      "     \\  (@@@(oo)@@@)  /     ",
      "      '._(@@@@@@@@)_. '      ",
      "         '-.____.-'          ",
      "             ||              ",
      "             ||              ",
      "      __     ||     __       ",
      "     /  \\____||____/  \\      ",
      "     \\____   ||   ____/      ",
      "          \\__||__/           ",
      "             ||              ",
      "             ||              ",
      "             ||              "
    ];
    const flowers = Array.from(document.querySelectorAll(".flower"));
    const cmd = document.getElementById("command");
    const log1 = document.getElementById("log1");
    const log2 = document.getElementById("log2");
    const wish = document.getElementById("wish");
    const wishCaret = document.getElementById("wish-caret");
    const subtext = document.getElementById("subtext");
    const msgCommand = document.getElementById("msg-command");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    let run = 0;

    function prepareCharacters() {
      const frames = [];
      const width = Math.max(...rose.map(line => line.length));
      flowers.forEach(flower => flower.replaceChildren());
      for (let row = 0; row < rose.length; row++) {
        for (let f = 0; f < flowers.length; f++) {
          const line = rose[row].padEnd(width);
          const frag = document.createDocumentFragment();
          for (const symbol of line) {
            if (symbol === " ") {
              frag.append(document.createTextNode(" "));
              continue;
            }
            const span = document.createElement("span");
            span.textContent = symbol;
            span.className = "char " + (row < 8
              ? (symbol === "@" || symbol === "o" ? "petal" : "soft")
              : (row >= 10 && (symbol === "_" || symbol === "/" || symbol === "\\") ? "leaf" : "stem"));
            frag.append(span);
            frames.push(span);
          }
          frag.append(document.createTextNode("\n"));
          flowers[f].append(frag);
        }
      }
      // Output in terminal reading order: top row, left to right, then next row.
      frames.sort((a, b) => {
        const pa = Array.prototype.indexOf.call(flowers, a.closest(".flower"));
        const pb = Array.prototype.indexOf.call(flowers, b.closest(".flower"));
        const ra = [...a.closest(".flower").childNodes].filter(n => n.nodeType === 3 && n.textContent.includes("\n"));
        void ra; // No visual sprites: characters stay positioned in the pre.
        return 0;
      });
      return frames;
    }

    async function type(target, text, delay, id) {
      for (const char of text) {
        if (id !== run) return false;
        target.textContent += char;
        if (!reducedMotion) await sleep(delay);
      }
      return true;
    }

    async function animate() {
      const id = ++run;
      cmd.textContent = "";
      log1.textContent = "";
      log2.textContent = "";
      msgCommand.textContent = "";
      wish.textContent = "";
      wishCaret.hidden = true;
      subtext.classList.remove("visible");
      const pixels = prepareCharacters();
      await type(cmd, "python3 roses.py", 43, id);
      if (id !== run) return;
      log1.textContent = "[INFO] Preparing a little bit of luck...";
      if (!reducedMotion) await sleep(300);
      if (id !== run) return;
      if (reducedMotion) {
        pixels.forEach(pixel => pixel.classList.add("visible"));
      } else {
        for (let i = 0; i < pixels.length; i += 3) {
          if (id !== run) return;
          for (let j = i; j < Math.min(i + 3, pixels.length); j++) {
            pixels[j].classList.add("visible");
          }
          await sleep(13);
        }
      }
      if (id !== run) return;
      log2.innerHTML = '<span class="ok">[ OK ]</span> 3 roses rendered successfully';
      if (!reducedMotion) await sleep(330);
      if (id !== run) return;
      msgCommand.textContent = '$ echo "Удачи на экзамене"';
      wishCaret.hidden = false;
      await type(wish, "Удачи на экзамене", 88, id);
      if (id !== run) return;
      subtext.classList.add("visible");
    }

    document.getElementById("replay").addEventListener("click", animate);
    document.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "r" && !event.altKey && !event.ctrlKey &&
          !event.metaKey && !event.repeat && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        animate();
      }
    });
    animate();
  </script>
</body>
</html>
